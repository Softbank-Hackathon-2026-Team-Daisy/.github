name: 결정 필요
description: 팀이 정해야 할 선택지 (결정되면 노션 ADR로 옮겨요)
title: "[결정] "
labels: ["decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: 배경
      description: 왜 지금 정해야 하나요
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 선택지
      placeholder: "A. ...\nB. ..."
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 판단 기준
      placeholder: "구현 난이도, 데모 안정성, 심사 기준과의 연결 등"
  - type: input
    id: deadline
    attributes:
      label: 결정 기한
      placeholder: "예: 9/30 회의"
  - type: textarea
    id: result
    attributes:
      label: 결정과 이유 (결정 후 작성)
      description: 결정되면 노션 ADR 번호도 적어요
